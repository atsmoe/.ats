name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # The release-note guard compares the complete range of a push.
          # A push may contain more than two commits, so a shallow checkout is insufficient.
          fetch-depth: 0

      - name: Verify changelog and development log
        if: github.event_name == 'push'
        run: node scripts/check-release-notes.js "${{ github.event.before }}" "${{ github.sha }}"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Check build dependency advisories
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Record tested distribution
        run: |
          echo "Testing commit $GITHUB_SHA"
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dist-before.sha256"
      - name: Install browser for release checks
        run: npx playwright install --with-deps chromium
      - name: Verify release interactions
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: browser-results-${{ github.sha }}-${{ github.job }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      # Verify production build quality
      - name: Verify no source maps in dist
        run: |
          MAPS=$(find dist -name "*.map" 2>/dev/null | wc -l)
          if [ "$MAPS" -gt 0 ]; then
            echo "::error::Found $MAPS source map file(s) in dist — sourcemap should be disabled"
            find dist -name "*.map" | head -5
            exit 1
          fi
          echo "✅ No source maps in dist"

      - name: Verify JS is minified
        run: |
          for f in dist/js/bundle.js dist/js/star-map-3d.js; do
            SIZE=$(wc -c < "$f")
            if [ "$SIZE" -gt 600000 ]; then
              echo "::warning::$f is ${SIZE} bytes — consider further splitting"
            fi
          done
          echo "✅ JS bundles checked"

      - name: Verify tested distribution is unchanged
        run: |
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/dist-after.sha256"
          diff -u "$RUNNER_TEMP/dist-before.sha256" "$RUNNER_TEMP/dist-after.sha256"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
